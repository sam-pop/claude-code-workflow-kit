name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # kit: the stack's runtime and install, e.g.
      #   - uses: actions/setup-node@v4
      #     with: { node-version-file: .nvmrc, cache: npm }
      #   - run: npm ci
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Install semgrep
        run: pipx install semgrep
      - run: scripts/check.sh all
