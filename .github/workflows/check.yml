name: check

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; nothing in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · bash ${{ matrix.bash }} · ${{ matrix.run }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Everything, with the real pinned tools: tests that need one fail instead of skipping.
          - { os: ubuntu-latest, bash: "5", run: all, real: "1" }
          # The bats suite under macOS /bin/bash 3.2 and BSD userland (the floor the kit supports).
          - { os: macos-latest, bash: "3.2", run: test, real: "" }
    steps:
      # Actions are pinned to a full commit SHA (the tag in the comment); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Put /bin/bash 3.2 first on PATH
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >>"$GITHUB_PATH"
      - name: Pinned tools (checksum verified)
        if: runner.os == 'Linux'
        run: |
          scripts/tools.sh install
          echo "$PWD/.tools/bin" >>"$GITHUB_PATH"
      - name: scripts/check.sh ${{ matrix.run }}
        env:
          KIT_EXPECT_BASH: ${{ matrix.bash }}
          KIT_REQUIRE_REAL_TOOLS: ${{ matrix.real }}
          RUN: ${{ matrix.run }}
        run: scripts/check.sh "$RUN"
